<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  body { display: flex; align-items: center; justify-content: center; font: 700 12px -apple-system, "Apple SD Gothic Neo", "Segoe UI", "Malgun Gothic", sans-serif; }
  #t { display: flex; align-items: center; gap: 7px; padding: 6px 12px 6px 7px; border-radius: 16px; color: #f4f1fa; white-space: nowrap;
       background: linear-gradient(180deg, rgba(48,38,66,.94), rgba(26,21,36,.94)); border: 1px solid rgba(255,255,255,.16);
       box-shadow: inset 0 1px 0 rgba(255,255,255,.16), 0 1px 4px rgba(0,0,0,.35); opacity: 0; transform: translateY(6px) scale(.96); transition: opacity .18s, transform .18s; }
  #t.on { opacity: 1; transform: none; }
  #c { width: 16px; height: 16px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(255,255,255,.3); }
  #h { font-family: ui-monospace, Menlo, Consolas, monospace; letter-spacing: .3px; }
  #m { color: rgba(235,228,250,.6); font-weight: 500; }
</style>
</head>
<body>
<div id="t"><span id="c"></span><span id="h"></span><span id="m"></span></div>
<script>
  /* "copied" bubble shown above the widget (the window ignores the mouse) */
  const t = document.getElementById("t");
  window.sw.on("toast-show", (d) => {
    document.getElementById("c").style.background = d.hex;
    document.getElementById("h").textContent = d.hex.slice(1);
    document.getElementById("m").textContent = d.msg;
    t.classList.remove("on"); void t.offsetWidth; t.classList.add("on");
    clearTimeout(window.__t); window.__t = setTimeout(() => t.classList.remove("on"), 1500);
  });
</script>
</body>
</html>
