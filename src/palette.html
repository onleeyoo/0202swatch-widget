<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>0202Swatch</title>
<style>
  /* ---- 0202 design tokens: dark + purple, light "liquid glass" ---- */
  :root {
    --bg: #0c0a11; --text: #f4f1fa; --sub: rgba(235,228,250,.58); --faint: rgba(235,228,250,.34);
    --glass: linear-gradient(180deg, rgba(255,255,255,.075), rgba(255,255,255,.025));
    --glass-hi: linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.04));
    --edge: rgba(255,255,255,.09); --edge-hi: rgba(255,255,255,.16);
    --shine: inset 0 1px 0 rgba(255,255,255,.14), inset 0 -1px 0 rgba(0,0,0,.25);
    --purple: #7c4dff; --purple-2: #a98bff; --purple-glow: rgba(124,77,255,.45);
    --red: #ff7a6b; --ok: #8fe3a9; --tile: 28px; --r: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; color: var(--text); font: 12.5px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", "Segoe UI Variable", "Segoe UI", "Malgun Gothic", sans-serif; -webkit-font-smoothing: antialiased; }
  /* the window itself is frosted (vibrancy / acrylic); this tint keeps it dark */
  html { background: transparent; }
  body { display: flex; flex-direction: column; overflow: hidden; user-select: none; -webkit-user-select: none;
    background: radial-gradient(120% 60% at 0% 0%, rgba(124,77,255,.16), transparent 60%), rgba(14,11,20,.78); }
  body.solid { background: radial-gradient(120% 60% at 0% 0%, rgba(124,77,255,.16), transparent 60%), #0e0b14; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  svg { display: block; }
  ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.14); border-radius: 3px; } ::-webkit-scrollbar-track { background: transparent; }

  /* header */
  header { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 12px 12px 8px 14px; -webkit-app-region: drag; }
  header button { -webkit-app-region: no-drag; }
  .hleft { display: flex; align-items: center; gap: 4px; min-width: 0; }
  .brand { font-size: 14px; letter-spacing: -.1px; color: var(--sub); display: flex; align-items: center; gap: 7px; white-space: nowrap; font-weight: 500; }
  .brand b { color: var(--text); font-weight: 700; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: radial-gradient(circle at 32% 30%, #fff 0 12%, #c9b6ff 30%, #7c4dff 70%, #4b26b8); box-shadow: 0 0 8px var(--purple-glow); }
  .ib { width: 26px; height: 26px; border-radius: 9px; color: var(--sub); display: flex; align-items: center; justify-content: center; font-size: 13px; transition: background .15s, color .15s; }
  .ib svg { width: 14px; height: 14px; }
  .ib:hover { background: rgba(255,255,255,.08); color: var(--text); }
  .hbtns { display: flex; gap: 2px; }

  /* main action: glossy purple pill */
  .pickBig { flex: none; margin: 2px 12px 0; height: 48px; border-radius: 16px; color: #fff;
    background: linear-gradient(180deg, #8a5cff 0%, #6c3ff0 100%);
    border: 1px solid rgba(255,255,255,.22);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.35), inset 0 -2px 6px rgba(40,10,120,.35), 0 8px 22px rgba(108,63,240,.35);
    display: flex; align-items: center; justify-content: center; gap: 9px; font-size: 14px; font-weight: 650; letter-spacing: -.1px; transition: transform .12s, filter .15s; }
  .pickBig svg { width: 18px; height: 18px; }
  .pickBig small { font: 600 10.5px ui-monospace, "SF Mono", Menlo, Consolas, monospace; padding: 2px 7px; border-radius: 7px; background: rgba(255,255,255,.16); box-shadow: inset 0 1px 0 rgba(255,255,255,.2); }
  .pickBig:hover { filter: brightness(1.08); }
  .pickBig:active { transform: scale(.985); }
  /* round pick button on the left, image tools stacked on the right */
  .pickRow { flex: none; display: flex; align-items: center; gap: 10px; margin: 2px 12px 0; }
  .pickRow .pickBig { margin: 0; width: 80px; height: 80px; border-radius: 50%; flex-direction: column; gap: 5px; padding: 0; }
  .pickRow .pickBig svg { width: 24px; height: 24px; }
  .pickRow .pickBig .pl { display: none; }
  .pickRow .tools2 { flex: 1; flex-direction: column; margin: 0; gap: 6px; }
  .pickRow .tools2 button { flex: none; height: 37px; justify-content: flex-start; padding: 0 14px; }
  .pickBig.on { animation: glow 1s ease-in-out infinite alternate; }
  @keyframes glow { to { box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 0 26px rgba(169,139,255,.75); } }

  /* glass card */
  .cur, .imgCard { background: var(--glass); border: 1px solid var(--edge); border-radius: var(--r); box-shadow: var(--shine); backdrop-filter: blur(18px) saturate(150%); }
  .cur { flex: none; margin: 8px 12px 0; padding: 8px 10px; display: flex; gap: 10px; align-items: center; }
  .big { width: 34px; height: 34px; border-radius: 11px; flex: none; cursor: pointer; position: relative; box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); }
  .info { flex: 1; min-width: 0; }
  /* "#" + editable hex + copy icon */
  .info .h { display: flex; align-items: center; gap: 1px; font: 650 15px ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: .4px; }
  .info .h .hash { color: var(--faint); }
  .info .h input { width: 8.4ch; padding: 2px 7px; margin-left: 3px; border-radius: 7px; border: 1px solid rgba(255,255,255,.14); background: rgba(0,0,0,.28); box-shadow: inset 0 1px 2px rgba(0,0,0,.35); color: var(--text); font: inherit; letter-spacing: inherit; text-transform: uppercase; outline: none; cursor: text; -webkit-user-select: text; user-select: text; }
  .info .h input:hover { border-color: rgba(255,255,255,.26); }
  .info .h input:focus { background: rgba(0,0,0,.3); border-color: rgba(169,139,255,.6); box-shadow: 0 0 0 3px rgba(124,77,255,.15); }
  .info .h input.bad { border-color: rgba(255,122,107,.7); }
  .info .h .cp { width: 24px; height: 24px; margin-left: 4px; border-radius: 8px; color: var(--sub); display: flex; align-items: center; justify-content: center;
    background: var(--glass); border: 1px solid var(--edge); box-shadow: var(--shine); }
  .info .h .cp:hover { color: var(--text); border-color: var(--edge-hi); }
  .info .h .cp svg { width: 12px; height: 12px; }
  .info .h .cp.done { color: var(--ok); }
  .info .r { color: var(--faint); font-size: 10.5px; margin-top: 1px; }

  /* ▾ under the current color: opens the RGB adjust panel */
  .curWrap { flex: none; position: relative; margin: 8px 12px 8px; }
  .divider { flex: none; height: 1px; margin: 8px 12px 4px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.16) 15%, rgba(255,255,255,.16) 85%, transparent); }
  .curWrap .cur { margin: 0; position: relative; z-index: 2; }
  .adjT { position: absolute; left: 50%; bottom: -9px; transform: translateX(-50%); width: 30px; height: 17px; border-radius: 9px; z-index: 3;
    background: linear-gradient(180deg, rgba(58,46,82,.98), rgba(30,24,42,.98)); border: 1px solid rgba(255,255,255,.16); box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 2px 6px rgba(0,0,0,.4);
    color: var(--sub); display: flex; align-items: center; justify-content: center; }
  .adjT svg { width: 9px; height: 9px; transition: transform .2s; }
  .adjT:hover { color: var(--text); border-color: rgba(190,165,255,.5); }
  .curWrap.open .adjT svg { transform: rotate(180deg); }
  #adjBox { display: none; margin-top: -6px; overflow: hidden; }
  .curWrap.open #adjBox { display: block; }
  .adj { display: block; margin-top: 0; padding: 16px 12px 10px; border-radius: 0 0 var(--r) var(--r); background: rgba(0,0,0,.18); border: 1px solid var(--edge); border-top: 0; }
  .curWrap.open .cur { border-bottom-left-radius: 6px; border-bottom-right-radius: 6px; }
  .adj .row { display: flex; align-items: center; gap: 10px; height: 28px; }
  /* color on the left, RGB always open on the right */
  .curWrap .cur { align-items: stretch; gap: 12px; padding: 10px; }
  .cur .lft { flex: none; width: 128px; display: flex; flex-direction: column; gap: 8px; }
  .cur .lft .big { width: 56px; height: 56px; border-radius: 12px; }
  .cur .lft .info .h { font-size: 13.5px; }
  .cur .lft .info .h input { width: 7.6ch; padding: 2px 5px; margin-left: 2px; }
  .cur .lft .info .h .cp { width: 22px; height: 22px; margin-left: 3px; }
  .cur .lft .info .r { display: none; }
  .cur .adj { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 2px; padding: 0; margin: 0; border: 0; background: none; border-radius: 0; }
  .cur .adj .row { height: 26px; gap: 7px; }
  /* top: round pick button + hex on the left, RGB on the right; image tools in one row below */
  .cur.top2 { align-items: center; gap: 14px; padding: 12px 12px 12px 10px; }
  .top2 .tl { flex: none; width: 128px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .top2 .tl .pickBig { margin: 0; width: 96px; height: 96px; border-radius: 50%; flex-direction: column; gap: 6px; padding: 0; }
  .top2 .tl .pickBig svg { width: 26px; height: 26px; }
  .top2 .tl .pickBig .pl { display: none; }
  .top2 .tl .info { flex: none; }
  .top2 .tl .info .h { font-size: 13.5px; }
  .top2 .tl .info .h input { width: 7.6ch; padding: 2px 5px; margin-left: 2px; }
  .top2 .tl .info .h .cp { width: 22px; height: 22px; margin-left: 3px; }
  .top2 .tl .info .r { display: none; }
  .top2 .tl .big { display: none; }
  /* RGB block spans exactly the circle's height (top and bottom line up) */
  .cur.top2 { align-items: flex-start; }
  .top2 .adj { height: 96px; justify-content: space-between; gap: 0; }
  .cur.top2 { flex-wrap: wrap; row-gap: 10px; padding-top: 12px; }
  .cur.top2 .curH { flex: 0 0 100%; margin: 0 0 0 4px; font-size: 14px; font-weight: 700; color: var(--text); letter-spacing: -.2px; }
  .top2 .tl .pickBig small { display: none; }
  .cur.top2 .curH b { opacity: 1; font-weight: 700; color: var(--text); }
  /* never wider than the window: sliders shrink, the left column narrows */
  .cur.top2 { min-width: 0; }
  .top2 .tl { width: 112px; }
  .top2 .adj input[type=range] { min-width: 0; width: 100%; }
  .top2 .adj .row { min-width: 0; }
  .top2 .adj .row input[type=number] { flex: none; }
  .top2 .adj .row { height: 28px; }
  .top2 .tl .pickBig { border: 1px solid rgba(255,255,255,.28); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), inset 0 -2px 6px rgba(0,0,0,.18), 0 6px 18px rgba(0,0,0,.35); }
  .top2 .tl .pickBig small { background: rgba(0,0,0,.18); }
  .top2 .tl .pickBig.lightC small { background: rgba(0,0,0,.1); }
  .tools2.row2 { flex-direction: row; margin: 0 12px; }
  .tools2.row2 button { flex: 1; height: 36px; justify-content: center; }
  .cur .adj input[type=number] { width: 36px; padding: 0 5px; height: 22px; font-size: 11px; }
  .cur .adj input[type=range]::-webkit-slider-thumb { width: 14px; height: 14px; }
  .adj label { width: 12px; font: 600 11px ui-monospace, "SF Mono", Menlo, monospace; color: var(--sub); }
  .adj input[type=range] { flex: 1; -webkit-appearance: none; appearance: none; height: 8px; border-radius: 4px; outline: none; box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); }
  .adj input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; cursor: pointer;
    background: linear-gradient(180deg, #fff, #e7e1f5); border: 1px solid rgba(255,255,255,.6); box-shadow: 0 1px 4px rgba(0,0,0,.5), inset 0 -1px 2px rgba(0,0,0,.12); }
  .adj input[type=number] { width: 44px; text-align: center; height: 24px; padding: 0 6px; border-radius: 7px; background: rgba(0,0,0,.3); border: 1px solid var(--edge); color: var(--text); font: 600 11.5px ui-monospace, "SF Mono", Menlo, monospace; text-align: right; outline: none; }
  .adj input[type=number]:focus { border-color: rgba(169,139,255,.6); }
  .adj input[type=number]::-webkit-inner-spin-button, .adj input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .tools2 { flex: none; display: flex; gap: 6px; margin: 8px 12px 0; }
  .tools2 button { flex: 1; height: 32px; border-radius: 11px; background: var(--glass); border: 1px solid var(--edge); box-shadow: var(--shine); color: var(--sub); font-size: 11.5px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 6px; transition: color .15s, border-color .15s; }
  .tools2 button:hover { color: var(--text); border-color: var(--edge-hi); background: var(--glass-hi); }
  .tools2 svg { width: 13px; height: 13px; }

  main { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 12px 14px; }
  h3 { font-size: 11px; font-weight: 600; color: var(--sub); margin: 14px 2px 7px; display: flex; align-items: center; gap: 6px; letter-spacing: 0; }
  h3 b { font-weight: 600; color: var(--text); opacity: .82; }
  h3 > span { color: var(--faint); font-weight: 500; }
  h3 .lnk { color: var(--sub); font-size: 11px; padding: 3px 8px; border-radius: 8px; font-weight: 500; }
  h3 .lnk:hover { background: rgba(255,255,255,.07); color: var(--text); }
  .grow { flex: 1; }
  /* recent picks: 3 rows, the rest behind "＋ n more" */
  #recent { max-height: calc(var(--tile) + 2px); overflow: hidden; padding: 1px; margin: -1px; }
  #recent.all { max-height: none; }
  .more { display: none; margin-top: 6px; height: 24px; padding: 0 10px; border-radius: 12px; font-size: 11px; font-weight: 500; color: var(--sub);
    background: var(--glass); border: 1px solid var(--edge); box-shadow: var(--shine); }
  .more:hover { color: var(--text); border-color: var(--edge-hi); }
  .more.show { display: inline-flex; align-items: center; }
  h3.sec2 { margin-top: 26px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.06); }

  /* swatches: soft rounded tiles with a glass highlight */
  .tiles { display: flex; flex-wrap: wrap; gap: 5px; }
  .sw { width: var(--tile); height: var(--tile); border-radius: 9px; cursor: pointer; position: relative; transition: transform .12s;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
  .sw:hover { transform: translateY(-1px) scale(1.08); z-index: 2; }
  .sw.pair { box-shadow: inset 0 0 0 3px var(--o); }
  #trash { position: fixed; left: 12px; right: 12px; bottom: 10px; height: 46px; border-radius: 14px; display: none; align-items: center; justify-content: center; gap: 6px;
    font-size: 12.5px; font-weight: 600; color: #ffd9da; background: rgba(229,72,77,.22); border: 1.5px dashed rgba(229,72,77,.7); backdrop-filter: blur(10px); z-index: 50; }
  body.dragColor #trash { display: flex; }
  #selBar { position: fixed; left: 12px; right: 12px; bottom: 10px; height: 46px; border-radius: 14px; display: none; align-items: center; gap: 6px; padding: 0 8px 0 14px;
    font-size: 11.5px; color: #e9e3f7; background: rgba(40,30,62,.82); border: 1px solid rgba(167,139,250,.45); backdrop-filter: blur(14px); z-index: 49; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
  #selBar .grow { flex: 1; }
  #selBar button { font-size: 11.5px; font-weight: 600; padding: 6px 11px; border-radius: 9px; color: #fff; background: rgba(255,255,255,.1); }
  #selBar button.danger { background: rgba(229,72,77,.75); }
  #selBar button:disabled { opacity: .35; }
  body.selMode #selBar { display: flex; }
  body.selMode.dragColor #selBar { display: none; }
  body.selMode main { padding-bottom: 54px; }
  .selBtn.on { color: #fff !important; background: rgba(139,92,246,.55); }
  .sw.sel { box-shadow: inset 0 0 0 2px #fff, inset 0 0 0 4px rgba(139,92,246,.95); }
  .sw.sel::before { content: "✓"; position: absolute; right: 2px; bottom: 1px; font-size: 10px; font-weight: 800; color: #fff; text-shadow: 0 0 3px #000, 0 0 2px #000; }
  #trash.over { background: rgba(229,72,77,.55); color: #fff; border-style: solid; }
  .sw[draggable=true] { cursor: grab; }
  .sw.ins::before { content: ""; position: absolute; left: -4px; top: 1px; bottom: 1px; width: 2px; background: var(--purple-2); border-radius: 1px; box-shadow: 0 0 6px var(--purple-glow); }
  .sw.addT { background: transparent; border: 1.5px dashed rgba(255,255,255,.2); box-shadow: none; color: var(--faint); display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 300; }
  .sw.addT:hover { border-color: var(--purple-2); color: var(--purple-2); transform: none; }
  .sw.dragging, .chip.dragging { opacity: .3; }

  /* projects: list on the left, colors on the right */
  .projLayout { display: flex; gap: 10px; margin-top: 4px; align-items: flex-start; }
  #plist { width: 112px; flex: none; display: flex; flex-direction: column; gap: 2px; padding-right: 10px; border-right: 1px solid rgba(255,255,255,.06); align-self: stretch; }
  .projLayout.collapsed #plist { display: none; }
  .plistRows { display: flex; flex-direction: column; gap: 2px; }
  #plist .chip { display: flex; align-items: center; gap: 3px; width: 100%; height: 30px; padding: 0 8px; border-radius: 10px; text-align: left; background: transparent; border: 1px solid transparent; box-shadow: none; color: var(--sub); }
  #plist .chip:hover { background: rgba(255,255,255,.05); color: var(--text); }
  #plist .chip.on { color: #fff; background: linear-gradient(180deg, rgba(138,92,255,.5), rgba(108,63,240,.36)); border-color: rgba(190,165,255,.4); box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 4px 12px rgba(108,63,240,.25); }
  #plist .chip.insL { box-shadow: inset 0 2px 0 var(--purple-2); }
  #plist .chip .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #plist .chip .cnt, #pc { display: none !important; }
  #plist .chip .more { flex: none; width: 18px; height: 18px; margin-right: -4px; border-radius: 6px; display: none; align-items: center; justify-content: center; font-size: 13px; line-height: 1; color: var(--dim, #bbb); }
  #plist .chip:hover .more { display: inline-flex; }
  #plist .chip .more:hover { background: rgba(255,255,255,.14); color: #fff; }
  .pressing { transition: transform .45s; transform: scale(.94); }
  #plist .chip.on .cnt { color: rgba(255,255,255,.7); }
  #plist .chip.preset { font-weight: 600; margin-bottom: 6px; position: relative; }
  #plist .chip.preset::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: -4px; height: 1px; background: rgba(255,255,255,.1); }
  #plist .chip.preset .pdot { width: 8px; height: 8px; border-radius: 50%; flex: none; margin-right: 4px; background: conic-gradient(#ffe400, #ff5a5a, #8a5cff, #3cc8ff, #ffe400); }
  .pcat { font-size: 12px; font-weight: 700; color: var(--text); margin: 12px 2px 2px; }
  .pcat:first-child { margin-top: 2px; }
  .ptip { font-size: 10.5px; color: var(--faint); margin: 0 2px 6px; line-height: 1.4; }
  #plist .chip .star { margin-right: 1px; font-size: 10px; }
  #plist .hiddenSec { margin-top: 8px; }
  .newRow { margin-top: 8px; height: 28px; border-radius: 10px; border: 1px dashed rgba(255,255,255,.16); color: var(--sub); font-size: 11px; font-weight: 500; }
  .newRow:hover { border-color: var(--purple-2); color: var(--text); }
  .pmain { flex: 1; min-width: 0; }
  .pTitle { font-size: 12.5px; font-weight: 600; margin: 5px 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sideBtn { width: 22px; height: 22px; border-radius: 7px; color: var(--sub); display: flex; align-items: center; justify-content: center; margin-left: -4px; }
  .sideBtn svg { width: 14px; height: 14px; }
  .sideBtn:hover { background: rgba(255,255,255,.07); color: var(--text); }
  /* project chips: glass pills, active = purple tint */
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip { height: 28px; padding: 0 12px; border-radius: 14px; background: var(--glass); border: 1px solid var(--edge); box-shadow: var(--shine); color: var(--sub); font-weight: 500; transition: color .15s, border-color .15s, background .15s; }
  .chip:hover { color: var(--text); border-color: var(--edge-hi); }
  .chip.on { color: #fff; background: linear-gradient(180deg, rgba(138,92,255,.55), rgba(108,63,240,.4)); border-color: rgba(190,165,255,.45); box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 4px 14px rgba(108,63,240,.3); }
  .chip.drop { outline: 2px dashed var(--purple-2); outline-offset: 2px; }
  .chip.insL { box-shadow: -4px 0 0 -1px var(--purple-2); }
  .chip .star { color: #ffd479; margin-right: 4px; }
  #projBody { border-radius: 12px; min-height: 40px; margin-top: 8px; transition: background .15s; }
  #projBody.drop { outline: 2px dashed var(--purple-2); outline-offset: 4px; background: rgba(124,77,255,.06); }
  /* folder tree */
  #plist, #pTitle, #sideBtn { display: none !important; }
  .projLayout { display: block !important; margin-top: 0 !important; }
  .pmain { gap: 0 !important; }
  #projBody > .frow:first-child { margin-top: 0; }
  .pmain { height: 100%; }
  .frow { display: flex; align-items: center; gap: 7px; width: 100%; height: 34px; padding-right: 8px; border-radius: 9px; text-align: left; color: var(--text); font-size: 12.5px; font-weight: 500;
    background: rgba(255,255,255,.035); border: 1px solid transparent; margin-top: 4px; }
  .frow:hover { background: rgba(255,255,255,.07); }
  .frow.on { background: rgba(124,77,255,.22); border-color: rgba(190,165,255,.28); }
  .frow.dim { color: var(--sub); }
  .frow .chev { width: 10px; height: 10px; flex: none; color: var(--sub); transition: transform .15s; }
  .frow.open .chev { transform: rotate(90deg); }
  .frow .fold { width: 15px; height: 15px; flex: none; color: #d9d4e6; opacity: .9; }

    card.innerHTML = '<div class="top"><img><div class="tt"></div><button class="ib" title="✕">✕</button></div><div class="lbl l1"></div><div class="strip"></div><div class="lbl l2"></div><div class="pct"></div><div class="btns"><button class="b1"></button><button class="b2 pri"></button></div>';
    card.querySelector("img").src = src;
    card.querySelector(".tt").textContent = L("이미지에서 뽑은 색", "Colors from image", "画像の色");
    card.querySelector(".ib").onclick = () => slide("img", $("#imgBox"), null, 0, (x) => x, null, () => { imgRes = null; renderImg(); });
    card.querySelector(".l1").textContent = L("추천 조합 · 클릭하면 복사", "Suggested combo · click to copy", "おすすめ配色 · クリックでコピー");
    const strip = card.querySelector(".strip");
    r.combo.forEach((q) => {
      const sp = document.createElement("span"); sp.style.background = q.h; sp.title = q.h; sp.onclick = () => copy(q.h);
      sp.draggable = true; sp.addEventListener("dragstart", (e) => { dragging = { items: [{ kind: "img", h: q.h, n: "", o: "" }] }; dragDel = null; e.dataTransfer.setData(CT, JSON.stringify({ h: q.h })); e.dataTransfer.effectAllowed = "copyMove"; });
      strip.appendChild(sp);
    });
    card.querySelector(".l2").textContent = L("많이 쓰인 색 (비율)", "Most used (share)", "よく使われている色");
    const pc = card.querySelector(".pct");
    r.all.forEach((q) => { const t = tile(q.h, q.pct + "%", null, "", { kind: "recent" }); pc.appendChild(t); });
    const p = curProj();
    card.querySelector(".b1").textContent = p ? L("'" + p.name + "'에 조합 추가", "Add combo to '" + p.name + "'", "「" + p.name + "」に追加") : "—";
    if (!p) card.querySelector(".b1").style.display = "none";
    card.querySelector(".b1").onclick = () => { const pp = curProj(); if (!pp) return; const n = r.combo.filter((q) => addColor(pp, { h: q.h })).length; render(); toast(n ? L("조합 " + n + "개를 넣었어요" + (n < r.combo.length ? " · 중복 " + (r.combo.length - n) + "개 제외" : ""), "Added " + n + " colors", "追加しました") : dupMsg()); };
    card.querySelector(".b2").textContent = L("새 프로젝트로 저장", "Save as new project", "新規プロジェクトで保存");
    card.querySelector(".b2").onclick = () => {
      const e2 = { key: "w" + Date.now().toString(36), name: L("이미지 색 ", "Image colors ", "画像の色 ") + new Date().toLocaleDateString(), groups: [{ id: "g" + Date.now().toString(36), name: L("추천 조합", "Combo", "配色"), colors: r.combo.map((q) => ({ h: q.h, n: "" })) }, { id: "g2" + Date.now().toString(36), name: L("많이 쓰인 색", "Most used", "よく使う色"), colors: r.all.map((q) => ({ h: q.h, n: q.pct + "%" })) }] };
      store.projects.unshift(e2); setActive(e2.key); save(); render(); toast(L("새 프로젝트로 저장했어요 · 우클릭으로 이름 바꾸기", "Saved · right-click to rename", "保存しました"));
    };
    box.appendChild(card);
  }
  function readFileImg(f) { if (!f || !/^image\//.test(f.type)) return false; const rd = new FileReader(); rd.onload = () => showImage(rd.result); rd.readAsDataURL(f); return true; }
  $("#imgOpen").onclick = () => $("#imgFile").click();
  $("#imgFile").addEventListener("change", (e) => { readFileImg(e.target.files[0]); e.target.value = ""; });
  $("#imgCap").onclick = async () => { const d = await window.sw.captureRegion(); if (d) showImage(d); };
  window.addEventListener("paste", (e) => {
    if (document.activeElement && document.activeElement.tagName === "INPUT") return;
    const it = Array.prototype.find.call(e.clipboardData.items || [], (x) => /^image\//.test(x.type));
    if (it) { e.preventDefault(); readFileImg(it.getAsFile()); }
  });
  document.addEventListener("dragover", (e) => { if (hasType(e, "Files")) { e.preventDefault(); document.body.classList.add("fileOver"); } });
  document.addEventListener("dragleave", (e) => { if (!e.relatedTarget) document.body.classList.remove("fileOver"); });
  document.addEventListener("drop", (e) => {
    document.body.classList.remove("fileOver");
    if (!hasType(e, "Files")) return;
    e.preventDefault();
    if (!readFileImg(e.dataTransfer.files[0])) toast(L("이미지 파일만 돼요", "Images only", "画像のみ"));
  });
  ["mousedown", "contextmenu"].forEach((t) => document.addEventListener(t, (ev) => { if (ev.button === 2 || t === "contextmenu" || ev.ctrlKey) window.sw.log("rc " + t + " f" + (document.hasFocus() ? 1 : 0) + " b" + ev.button + " " + ((ev.target.closest && (ev.target.closest(".chip") ? "chip" : ev.target.className)) || ev.target.tagName)); }, true));
  window.sw.log("palette loaded sel1");
  /* macOS: an accessory app's window that isn't key never gets right-clicks -> take focus when the pointer comes in */
  let grabT = 0; const grab = () => { if (document.hasFocus() || Date.now() - grabT < 500) return; grabT = Date.now(); window.sw.focusSelf(); };
  document.addEventListener("pointerenter", grab, true); document.addEventListener("mousemove", grab, true);
  $("#pTitle").addEventListener("contextmenu", (ev) => { ev.preventDefault(); const c = document.querySelector('.chip[data-key="' + active + '"]'); if (c) c.dispatchEvent(new MouseEvent("contextmenu", { bubbles: true, cancelable: true, clientX: ev.clientX, clientY: ev.clientY })); });
  (function () {
    const t = document.createElement("div"); t.id = "trash"; t.textContent = "🗑 " + L("여기에 놓으면 삭제", "Drop here to delete", "ここにドロップで削除"); document.body.appendChild(t);
    t.addEventListener("dragover", (e) => { if (dragDel) { e.preventDefault(); e.dataTransfer.dropEffect = "move"; t.classList.add("over"); } });
    t.addEventListener("dragleave", () => t.classList.remove("over"));
    t.addEventListener("drop", (e) => { e.preventDefault(); e.stopPropagation(); t.classList.remove("over"); document.body.classList.remove("dragColor"); const f = dragDel; dragDel = null; dragging = null; if (f) delItems(f); });
  })();
  function setSel(on) {
    selMode = on; if (!on) sel.clear();
    document.body.classList.toggle("selMode", on);
    document.querySelectorAll(".selBtn").forEach((b) => { b.textContent = on ? L("선택 해제", "Cancel", "解除") : L("선택", "Select", "選択"); b.classList.toggle("on", on); });
    render(); updSel();
  }
  function updSel() {
    const n = selItems().length;
    $("#selN").textContent = n ? L(n + "개 선택됨 · 끌어서 이동, ⌥ 끌면 복제", n + " selected · drag to move, ⌥ to copy", n + " 件選択") : L("색을 눌러 선택하세요", "Click colors to select", "色をクリックして選択");
    $("#selDel").textContent = L("삭제", "Delete", "削除"); $("#selDel").disabled = !n;
    $("#selDone").textContent = L("취소", "Cancel", "キャンセル");
  }
  document.querySelectorAll(".selBtn").forEach((b) => b.onclick = () => setSel(!selMode));
  $("#selDel").onclick = () => { const it = selItems(); if (it.length) delItems(it); };
  $("#selDone").onclick = () => setSel(false);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && selMode) setSel(false); });
  setSel(false);
  const footH = () => document.documentElement.style.setProperty("--footH", $("#status").offsetHeight + "px");
  footH(); window.addEventListener("resize", footH);
  /* nothing dropped on the page may open as a page of its own */
  document.addEventListener("dragover", (e) => { if (e.dataTransfer && [...e.dataTransfer.types].includes("Files")) return; e.preventDefault(); });
  document.addEventListener("drop", (e) => { if (!e.defaultPrevented) e.preventDefault(); });
  ["contextmenu"].forEach((t) => document.addEventListener(t, (ev) => window.sw.log("rc " + t + " " + ((ev.target.className && ev.target.className.baseVal === undefined ? ev.target.className : ev.target.tagName) || "")), true));
  window.addEventListener("error", (e) => { window.sw.log("palette " + e.message + " @" + e.lineno); status(L("화면 오류 · 여기를 누르면 진단 정보 복사", "Error · click to copy diagnostics", "エラー · クリックで診断情報をコピー"), true); });
  window.sw.presetsGet().then((l) => { presetList = Array.isArray(l) ? l : []; if (active === PRESET) render(); }).catch(() => {});
  window.sw.on("presets", (l) => { presetList = Array.isArray(l) ? l : []; if (active === PRESET) render(); });
  window.sw.on("key", (k) => { st.key = k; render(); });
  window.sw.on("picking", (on) => $("#pick").classList.toggle("on", !!on));
  window.sw.on("picked", (h) => { const n0 = st.recent.length; st.last = h; st.recent = [h].concat(st.recent.filter((x) => x !== h)).slice(0, 50); render(); fullNote(n0); toast(L(h.slice(1) + " 복사했어요", "Copied " + h.slice(1), h.slice(1) + " をコピー")); });
  window.sw.on("recent", (r) => { st.recent = r; render(); });
  window.sw.on("store-changed", (s) => { store = s; render(); });
  window.sw.on("status", (s) => status(s.msg, s.err));
  window.sw.on("lang", (l) => { LANG = l; applyStatic(); setSel(selMode); });   /* setSel re-labels the Select buttons and renders */
  Promise.all([window.sw.state(), window.sw.storeGet()]).then(([s, sto]) => {
    st = s; store = sto; LANG = s.lang || "ko";
    applyStatic(); setSel(selMode);
    if (s.status && s.status.msg) status(s.status.msg, s.status.err);
  });
</script>
