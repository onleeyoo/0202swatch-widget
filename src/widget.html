<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>0202Swatch</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; -webkit-user-select: none; }
  body { display: flex; align-items: center; justify-content: center; font: 600 10px -apple-system, "SF Pro Text", "Apple SD Gothic Neo", "Segoe UI", "Malgun Gothic", sans-serif; }
  /* glass sphere: the picked color inside, a soft rim, a specular highlight on top */
  #b { position: relative; width: 56px; height: 56px; border-radius: 50%; cursor: pointer; transition: transform .14s ease;
       box-shadow: 0 2px 6px rgba(0,0,0,.38), 0 0 0 1px rgba(124,77,255,.35), 0 0 5px rgba(124,77,255,.25); }   /* kept inside the 76px window so it isn't cut into a square */
  #b:hover { transform: scale(1.06); }
  #b:active { transform: scale(.95); }
  #sw { position: absolute; inset: 0; border-radius: 50%; background: #FFE400; display: flex; align-items: center; justify-content: center; overflow: hidden;
        box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.3); }
  #ic { position: relative; width: 20px; height: 20px; transition: opacity .15s; opacity: .85; }
  #hex { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 700 10px ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .2px; opacity: 0; transition: opacity .2s; }
  #b.show #hex { opacity: 1; } #b.show #ic { opacity: 0; }
  #b.picking::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid rgba(169,139,255,.9); animation: pulse 1s ease-out infinite; }
  @keyframes pulse { from { transform: scale(.9); opacity: 1; } to { transform: scale(1.2); opacity: 0; } }
  #pal { position: absolute; right: -4px; top: -4px; width: 20px; height: 20px; border-radius: 50%; z-index: 2; color: #f4f1fa;
         background: linear-gradient(180deg, rgba(60,48,84,.95), rgba(28,22,40,.95)); border: 1px solid rgba(255,255,255,.2); box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 2px 6px rgba(0,0,0,.4);
         display: flex; align-items: center; justify-content: center; opacity: 0; transform: scale(.8); transition: opacity .15s, transform .15s; }
  #b:hover #pal { opacity: 1; transform: none; }
  #pal svg { width: 10px; height: 10px; }
</style>
</head>
<body>
<div id="b" title="클릭: 화면에서 색 뽑기 (뽑은 색은 HEX로 복사돼요) · 끌기: 위치 이동 · 우클릭: 메뉴">
  <div id="sw">
    <svg id="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l3.4-3.4a2.1 2.1 0 1 1 3 3L18 9l.4.4a2.1 2.1 0 1 1-3 3l-3.8-3.8a2.1 2.1 0 1 1 3-3z" fill="currentColor" fill-opacity=".9"/><path d="M12.6 8.6L4 17.2V20h2.8l8.6-8.6"/><path d="M3 21l1-1"/></svg>
    <div id="hex"></div>
  </div>
  <div id="pal" title="팔레트 열기"><svg viewBox="0 0 12 12"><rect x="1" y="1" width="4" height="4" rx="1" fill="currentColor"/><rect x="7" y="1" width="4" height="4" rx="1" fill="currentColor"/><rect x="1" y="7" width="4" height="4" rx="1" fill="currentColor"/><rect x="7" y="7" width="4" height="4" rx="1" fill="currentColor"/></svg></div>
</div>
<script>
  /* Chromium eyedropper (used when the macOS sampler isn't available) */
  window.__eye = async function () {
    if (!window.EyeDropper) return "UNSUPPORTED";
    try { const r = await new EyeDropper().open(); return String(r.sRGBHex).toUpperCase(); } catch (e) { return null; }
  };
  const b = document.getElementById("b"), swEl = document.getElementById("sw"), hx = document.getElementById("hex"), ic = document.getElementById("ic");
  function lum(h) { const n = parseInt(h.slice(1), 16), r = (n >> 16) & 255, g = (n >> 8) & 255, bl = n & 255; return (0.299 * r + 0.587 * g + 0.114 * bl) / 255; }
  function paint(h, flash) {
    swEl.style.background = h;
    const dark = lum(h) > 0.6;
    ic.style.color = hx.style.color = dark ? "#111" : "#fff";
    if (flash) { hx.textContent = h.slice(1); b.classList.add("show"); clearTimeout(paint.t); paint.t = setTimeout(() => b.classList.remove("show"), 1600); }
  }
  /* click = pick, drag = move the widget */
  let down = null;
  b.addEventListener("mousedown", (e) => {
    if (e.button !== 0) return;
    if (e.target.closest("#pal")) return;
    down = { x: e.screenX, y: e.screenY, lx: e.screenX, ly: e.screenY, moved: false };
  });
  window.addEventListener("mousemove", (e) => {
    if (!down) return;
    if (!down.moved && Math.hypot(e.screenX - down.x, e.screenY - down.y) < 4) return;
    down.moved = true;
    window.sw.moveBy(e.screenX - down.lx, e.screenY - down.ly);
    down.lx = e.screenX; down.ly = e.screenY;
  });
  window.addEventListener("mouseup", (e) => {
    if (!down) return;
    const d = down; down = null;
    if (d.moved) window.sw.dragEnd(); else window.sw.pick();
  });
  document.getElementById("pal").addEventListener("click", (e) => { e.stopPropagation(); window.sw.openPalette(); });
  b.addEventListener("contextmenu", (e) => { e.preventDefault(); window.sw.menu(); });
  window.sw.on("picking", (on) => b.classList.toggle("picking", !!on));
  window.sw.on("picked", (h) => paint(h, true));
  window.sw.on("current", (h) => paint(h, false));
  const TIPS = { ko: ["클릭: 화면에서 색 뽑기 (HEX 복사) · 끌기: 이동 · 우클릭: 메뉴", "팔레트 열기"],
                 en: ["Click: pick a color (HEX copied) · drag: move · right-click: menu", "Open palette"],
                 ja: ["クリック: 色を取る（HEXコピー）· ドラッグ: 移動 · 右クリック: メニュー", "パレットを開く"] };
  function setLang(l) { const t = TIPS[l] || TIPS.en; b.title = t[0]; document.getElementById("pal").title = t[1]; }
  window.sw.on("lang", setLang);
  window.sw.state().then((s) => { paint(s.last || "#FFE400", false); setLang(s.lang); window.sw.rendererReady(); });
</script>
</body>
</html>
